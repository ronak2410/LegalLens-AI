<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LegalLens AI Scanner</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { width: 360px; min-height: 440px; background: #0B0F19; color: #E2E8F0; padding: 16px; font-size: 13px; }
    .header { display: flex; align-items: center; justify-content: space-between; padding-bottom: 12px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); margin-bottom: 14px; }
    .brand { display: flex; align-items: center; gap: 8px; }
    .brand-icon { width: 28px; height: 28px; background: linear-gradient(135deg, #06B6D4, #3B82F6); border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #FFF; font-weight: 800; font-size: 14px; }
    .brand-title { font-weight: 700; font-size: 15px; color: #FFF; }
    .brand-sub { font-size: 10px; color: #94A3B8; }
    .btn { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; padding: 10px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; }
    .btn-primary { background: linear-gradient(135deg, #06B6D4, #3B82F6); color: #070B14; font-weight: 700; }
    .btn-primary:hover { opacity: 0.92; }
    .card { background: rgba(30, 41, 59, 0.6); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 8px; padding: 12px; margin-bottom: 12px; }
    .risk-score { font-size: 24px; font-weight: 800; color: #FFF; }
    .badge-danger { background: rgba(239, 68, 68, 0.2); color: #F87171; padding: 2px 6px; border-radius: 4px; font-weight: 700; font-size: 10px; text-transform: uppercase; }
    .badge-success { background: rgba(16, 185, 129, 0.2); color: #34D399; padding: 2px 6px; border-radius: 4px; font-weight: 700; font-size: 10px; text-transform: uppercase; }
    .badge-warning { background: rgba(245, 158, 11, 0.2); color: #FBBF24; padding: 2px 6px; border-radius: 4px; font-weight: 700; font-size: 10px; text-transform: uppercase; }
    .spinner { width: 24px; height: 24px; border: 3px solid rgba(255,255,255,0.1); border-top-color: #06B6D4; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 20px auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="brand-icon">⚖️</div>
      <div>
        <div class="brand-title">LegalLens AI</div>
        <div class="brand-sub">Instant Web Scanner</div>
      </div>
    </div>
    <span id="scanBadge" class="badge-success">Ready</span>
  </div>

  <div id="initialView">
    <div class="card">
      <div style="font-weight: 600; color: #FFF; margin-bottom: 4px;">Target Web Page</div>
      <div style="font-size: 11px; color: #94A3B8; word-break: break-all;" id="pageUrl">Detecting active page...</div>
    </div>
    <button class="btn btn-primary" id="btnScanPage">Scan Page Legal Language</button>
  </div>

  <div id="loadingView" style="display: none; text-align: center; padding: 20px 0;">
    <div class="spinner"></div>
    <div style="font-weight: 600; color: #FFF;">Auditing Agreement Terms...</div>
    <div style="font-size: 11px; color: #94A3B8; margin-top: 4px;">Extracting clauses & detecting one-sided risks</div>
  </div>

  <div id="resultsView" style="display: none;">
    <div class="card" style="display: flex; justify-content: space-between; align-items: center;">
      <div>
        <div style="font-size: 10px; text-transform: uppercase; color: #94A3B8; font-weight: 700;">Risk Score</div>
        <div class="risk-score" id="resRiskScore">--/100</div>
      </div>
      <span id="resRiskBadge" class="badge-danger">High Risk</span>
    </div>

    <div class="card">
      <div style="font-size: 11px; font-weight: 700; text-transform: uppercase; color: #94A3B8; margin-bottom: 6px;">Key Flags Identified (<span id="resFlagCount">0</span>)</div>
      <div id="resFlagsList" style="display: flex; flex-direction: column; gap: 6px;"></div>
    </div>

    <button class="btn btn-primary" id="btnOpenStudio">Open in Full Web Studio &rarr;</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
